<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Monitoring Lampung</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #1a1a1a; color: white; text-align: center; }
        .header { background: #007bff; padding: 15px; font-weight: bold; }
        .container { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .form-group { width: 100%; max-width: 350px; margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #aaa; margin-bottom: 5px; display: block; }
        select, input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; 
            background: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px;
        }

        /* Tampilan Nama Toko yang muncul otomatis */
        #displayNama { 
            margin-top: 5px; font-size: 14px; color: #ffc107; font-weight: bold; min-height: 1.2em;
        }

        .camera-box { 
            position: relative; width: 100%; max-width: 350px; height: 380px; 
            background: #000; border: 2px solid #333; border-radius: 12px; overflow: hidden; margin-top: 10px;
        }
        video, #preview { width: 100%; height: 100%; object-fit: cover; }
        #preview { display: none; }
        #ghost { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4; display: none; pointer-events: none; }

        .btn-group { margin-top: 15px; width: 100%; max-width: 350px; }
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; margin-bottom: 10px; }
        #btn-main { background: #ffc107; color: black; }
        #btn-send { background: #28a745; color: white; display: none; }
        #btn-retry { background: #6c757d; color: white; display: none; }
        #status { font-size: 12px; color: #888; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="header">MTC PRESISI - KORWIL</div>

<div class="form-group">
    <label>Kode Toko (Wajib Diisi)*:</label>
    <input list="listToko" id="kodeToko" placeholder="Pilih/Ketik Kode..." oninput="updateNamaToko()" onfocus="muatDaftarToko()" required>
    <datalist id="listToko"></datalist>
    <div id="displayNama">-- Nama Toko Akan Muncul --</div>
</div>

    <div class="form-group">
        <label>Kode Toko (Dropdown/Ketik):</label>
        <input list="listToko" id="kodeToko" placeholder="Ketik Kode Toko..." oninput="updateNamaToko()" onfocus="muatDaftarToko()">
        <datalist id="listToko"></datalist>
        <div id="displayNama">-- Nama Toko Akan Muncul --</div>
    </div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <img id="preview" />
        <img id="ghost" src="" />
    </div>

    <div class="btn-group">
        <button id="btn-main" onclick="handleKamera()">AKTIFKAN KAMERA</button>
        <button id="btn-send" onclick="kirimKeDrive()">KIRIM FOTO</button>
        <button id="btn-retry" onclick="resetKamera()">ULANGI</button>
        <p id="status">Status: Standby</p>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec"; // GANTI DENGAN URL /exec ANDA
    
    let daftarToko = []; 
    let streamAktif = null;
    let fotoSebelumnya = null;

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const ghost = document.getElementById('ghost');
    const btnMain = document.getElementById('btn-main');
    const btnSend = document.getElementById('btn-send');
    const btnRetry = document.getElementById('btn-retry');
    const statusTxt = document.getElementById('status');
    const displayNama = document.getElementById('displayNama');

    async function muatDaftarToko() {
        if (daftarToko.length > 0) return;
        statusTxt.innerText = "Sinkronisasi data Korwil...";
        try {
            const res = await fetch(GAS_URL);
            daftarToko = await res.json();
            const list = document.getElementById('listToko');
            daftarToko.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.kode;
                list.appendChild(opt);
            });
            statusTxt.innerText = "Data Toko Terupdate.";
        } catch (e) { statusTxt.innerText = "Gagal memuat data."; }
    }

    function updateNamaToko() {
    const input = document.getElementById('kodeToko').value.toUpperCase();
    // Mencari apakah kode yang diketik ada di daftar yang ditarik dari Spreadsheet
    const ketemu = daftarToko.find(t => t.kode.toUpperCase() === input);
    
    if (input === "") {
        displayNama.innerText = "-- Nama Toko Akan Muncul --";
        displayNama.style.color = "#ffc107"; // Warna kuning standby
    } else if (ketemu) {
        displayNama.innerText = "Toko: " + ketemu.nama;
        displayNama.style.color = "#28a745"; // Warna hijau jika valid
    } else {
        displayNama.innerText = "-- Kode Tidak Dikenal --";
        displayNama.style.color = "#dc3545"; // Warna merah jika salah
    }
}

    async function handleKamera() {
        if (!streamAktif) {
            try {
                streamAktif = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = streamAktif;
                btnMain.innerText = "AMBIL FOTO";
                toggleGhost();
            } catch (e) { alert("Izin kamera ditolak!"); }
        } else {
            tangkapFoto();
        }
    }

    function tangkapFoto() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        preview.src = canvas.toDataURL('image/jpeg', 0.8);
        
        video.style.display = "none";
        preview.style.display = "block";
        btnMain.style.display = "none";
        btnSend.style.display = "block";
        btnRetry.style.display = "block";
    }

    function resetKamera() {
        video.style.display = "block";
        preview.style.display = "none";
        btnMain.style.display = "block";
        btnSend.style.display = "none";
        btnRetry.style.display = "none";
        toggleGhost();
    }

    function toggleGhost() {
        const tahap = document.getElementById('tahap').value;
        if (tahap === "SESUDAH" && fotoSebelumnya) {
            ghost.src = fotoSebelumnya;
            ghost.style.display = "block";
        } else {
            ghost.style.display = "none";
        }
    }

    function kirimKeDrive() {
    // Ambil data dari input
    const kode = document.getElementById('kodeToko').value.trim();
    const infoNama = document.getElementById('displayNama').innerText;
    const tahap = document.getElementById('tahap').value;

    // --- MULAI VALIDASI AKHIR ---
    
    // 1. Validasi: Jika kode kosong, hentikan proses
    if (!kode) {
        alert("Peringatan: KODE TOKO tidak boleh kosong!");
        document.getElementById('kodeToko').focus();
        return;
    }

    // 2. Validasi: Jika nama toko tidak muncul (salah ketik), hentikan proses
    if (infoNama.includes("Tidak Dikenal") || infoNama.includes("Akan Muncul")) {
        alert("Peringatan: KODE TOKO tidak valid atau belum terdaftar di sistem Korwil!");
        document.getElementById('kodeToko').focus();
        return;
    }

    // --- AKHIR VALIDASI AKHIR ---

    // Jika lolos semua pengecekan di atas, baru jalankan proses kirim
    statusTxt.innerText = "Sedang mengirim ke Drive...";
    btnSend.disabled = true;

    fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            tahap: tahap,
            kodeToko: kode,
            foto: preview.src
        })
    }).then(() => {
        alert("Laporan Berhasil Terkirim ke Folder: " + infoNama.replace("Toko: ", ""));
        
        // Logika Ghost Overlay: Simpan foto jika ini tahap SEBELUM
        if (tahap === "SEBELUM") {
            fotoSebelumnya = preview.src;
        }
        
        // Refresh halaman agar bersih untuk foto berikutnya
        location.reload();
    }).catch(e => {
        alert("Gagal mengirim data. Cek sinyal Lampung!");
        btnSend.disabled = false;
        statusTxt.innerText = "Gagal kirim, coba lagi.";
    });
}
</script>
</body>
</html>
