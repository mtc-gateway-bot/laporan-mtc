<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Monitoring - Lampung</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; text-align: center; }
        .header { background: #0056b3; padding: 15px; font-weight: bold; }
        .container { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Form Styling */
        .form-group { width: 100%; max-width: 350px; margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        select, input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; 
            background: #222; color: white; box-sizing: border-box; font-size: 16px;
        }

        /* Camera Box */
        .camera-box { 
            position: relative; width: 100%; max-width: 350px; height: 400px; 
            background: #000; border: 2px solid #0056b3; border-radius: 12px; overflow: hidden;
        }
        video, #preview { width: 100%; height: 100%; object-fit: cover; }
        #preview { display: none; }
        
        /* Ghost Overlay 40% */
        #ghost { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0.4; display: none; pointer-events: none; 
        }

        .btn-group { margin-top: 15px; width: 100%; max-width: 350px; }
        button { 
            width: 100%; padding: 15px; font-size: 16px; font-weight: bold; 
            border: none; border-radius: 8px; margin-bottom: 10px; cursor: pointer;
        }
        #btn-action { background: #ffc107; color: black; }
        #btn-send { background: #28a745; color: white; display: none; }
        #btn-reset { background: #dc3545; color: white; display: none; }
        
        #status { font-size: 13px; color: #888; margin-top: 5px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="header">DASHBOARD FOTO PEKERJAAN</div>

<div class="container">
    <div class="form-group">
        <label>Pilih Tahap Pekerjaan:</label>
        <select id="tahap" onchange="cekTahap()">
            <option value="SEBELUM">FOTO SEBELUM</option>
            <option value="PROSES">FOTO PROSES PEKERJAAN</option>
            <option value="SESUDAH">FOTO SESUDAH</option>
        </select>
    </div>

    <div class="form-group">
        <label>Kode Toko (Indomaret):</label>
        <input type="text" id="kodeToko" placeholder="Masukkan Kode Toko..." required>
    </div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <img id="preview" />
        <img id="ghost" src="" />
    </div>

    <div class="btn-group">
        <button id="btn-action" onclick="mulaiAtauAmbil()">AKTIFKAN KAMERA</button>
        <button id="btn-send" onclick="kirimFoto()">KIRIM & SIMPAN DATA</button>
        <button id="btn-reset" onclick="resetKamera()">AMBIL ULANG</button>
        <p id="status">Status: Standby</p>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const ghost = document.getElementById('ghost');
    const btnAction = document.getElementById('btn-action');
    const btnSend = document.getElementById('btn-send');
    const btnReset = document.getElementById('btn-reset');
    const statusTxt = document.getElementById('status');
    const canvas = document.getElementById('canvas');

    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec"; // GANTI DENGAN LINK /exec ANDA

    let streamAktif = null;

    async function mulaiAtauAmbil() {
        if (!streamAktif) {
            // Mode Aktifkan Kamera
            try {
                streamAktif = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = streamAktif;
                btnAction.innerText = "AMBIL FOTO";
                statusTxt.innerText = "Kamera Siap.";
                cekTahap(); // Cek jika butuh ghost overlay
            } catch (err) {
                alert("Izin kamera ditolak!");
            }
        } else {
            // Mode Ambil Foto
            ambilFoto();
        }
    }

    function cekTahap() {
        const tahap = document.getElementById('tahap').value;
        if (tahap === "SESUDAH") {
            // Di sini nanti logika fetch gambar SEBELUM dari Drive/Sheets
            // Untuk sementara kita pakai foto terakhir yang ada di memori jika ada
            if(ghost.src) {
                ghost.style.display = "block";
                statusTxt.innerText = "Overlay 40% Aktif.";
            } else {
                statusTxt.innerText = "Foto 'Sebelum' tidak ditemukan untuk referensi.";
            }
        } else {
            ghost.style.display = "none";
        }
    }

    function ambilFoto() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        preview.src = dataUrl;
        
        // Tampilan UI setelah ambil foto
        video.style.display = "none";
        preview.style.display = "block";
        ghost.style.display = "none";
        btnAction.style.display = "none";
        btnSend.style.display = "block";
        btnReset.style.display = "block";
        statusTxt.innerText = "Review foto sebelum dikirim.";
    }

    function resetKamera() {
        video.style.display = "block";
        preview.style.display = "none";
        btnAction.style.display = "block";
        btnSend.style.display = "none";
        btnReset.style.display = "none";
        cekTahap();
    }

    function kirimFoto() {
        const kode = document.getElementById('kodeToko').value;
        const tahap = document.getElementById('tahap').value;
        
        if(!kode) return alert("Isi Kode Toko!");

        statusTxt.innerText = "Mengirim...";
        btnSend.disabled = true;

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                tahap: tahap,
                kodeToko: kode,
                foto: preview.src
            })
        }).then(() => {
            alert("Laporan Berhasil Disimpan!");
            // Simpan foto sesudah ke ghost untuk referensi berikutnya
            ghost.src = preview.src;
            location.reload();
        }).catch(e => {
            alert("Gagal mengirim data.");
            btnSend.disabled = false;
        });
    }
</script>
</body>
</html>
