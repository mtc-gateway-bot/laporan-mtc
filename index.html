<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACL FOTO PEKERJAAN v1.5</title>
    <style>
        /* TEMA PUTIH POLOS */
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: #ffffff; color: #333; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #007bff; padding: 15px; font-weight: bold; font-size: 1.1em; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { padding: 10px; flex: 1; max-width: 500px; margin: auto; width: 100%; box-sizing: border-box; }
        
        .form-group { width: 100%; margin-bottom: 15px; text-align: left; }
        label { font-size: 12px; color: #666; margin-left: 5px; font-weight: bold; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #eee; background: #f9f9f9; color: #333; box-sizing: border-box; font-size: 16px; outline: none; margin-top: 5px; }
        input:focus { border-color: #007bff; background: #fff; }
        #displayNama { margin-top: 5px; font-size: 13px; color: #007bff; font-weight: bold; text-align: center; min-height: 18px; }
        
        /* GRID KOTAK DENGAN BORDER HALUS */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .slot-grid { aspect-ratio: 3/4; background: #f0f0f0; border: 2px dashed #ccc; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: 0.3s; }
        .slot-grid:active { transform: scale(0.98); }
        .slot-grid img { width: 100%; height: 100%; object-fit: contain; }
        .slot-label { font-size: 10px; color: #666; position: absolute; font-weight: bold; text-transform: uppercase; }

        /* KAMERA PANEL */
        #camContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .cam-view { flex: 1; position: relative; overflow: hidden; }
        video, #preview { width: 100%; height: 100%; object-fit: contain; }
        
        .cam-bottom-panel { height: 140px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #eee; }
        .btn-capture { background: white; border-radius: 50%; width: 70px; height: 70px; border: 5px solid #007bff; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn-action { padding: 15px; width: 85%; border-radius: 10px; font-weight: bold; border: none; font-size: 14px; cursor: pointer; }
        .btn-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; z-index: 10005; font-size: 18px; font-weight: bold; }

        #loaderOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10010; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="loaderOverlay"><div class="spinner"></div><div id="loaderText" style="margin-top:10px; color:#007bff; font-weight:bold;">Memproses...</div></div>

<div class="header">ACL FOTO PEKERJAAN</div>

<div class="container">
    <div class="form-group">
        <label>Kode Toko :</label>
        <input list="listToko" id="kodeToko" placeholder="Masukkan Kode Toko..." oninput="updateNamaToko()" disabled>
        <datalist id="listToko"></datalist>
        <div id="displayNama">Menunggu Database...</div>
    </div>

    <div class="photo-grid">
        <div class="slot-grid" onclick="pilihTahap(0, 'FOTO SEBELUM')"><img id="slot-0" style="display:none;"><span class="slot-label">SEBELUM</span></div>
        <div class="slot-grid" onclick="pilihTahap(1, 'FOTO PROSES 1')"><img id="slot-1" style="display:none;"><span class="slot-label">PROSES 1</span></div>
        <div class="slot-grid" onclick="pilihTahap(2, 'FOTO PROSES 2')"><img id="slot-2" style="display:none;"><span class="slot-label">PROSES 2</span></div>
        <div class="slot-grid" onclick="pilihTahap(3, 'FOTO SESUDAH')"><img id="slot-3" style="display:none;"><span class="slot-label">SESUDAH</span></div>
    </div>
    
    <button id="btn-save-all" onclick="buatKolase()" style="margin-top:25px; width:100%; padding:18px; background:#28a745; color:white; border:none; border-radius:12px; font-weight:bold; display:none; font-size:16px; box-shadow: 0 4px 10px rgba(40,167,69,0.3);">DOWNLOAD KOLASE</button>
</div>

<div id="camContainer">
    <button class="btn-close" onclick="tutupKamera()">✕</button>
    <div class="cam-view">
        <video id="video" autoplay playsinline></video>
        <img id="preview">
    </div>
    <div class="cam-bottom-panel">
        <div id="labelCam" style="font-size:12px; color:#007bff; font-weight:bold; text-transform:uppercase;"></div>
        <button class="btn-capture" id="btn-snap" onclick="tangkapFoto()"></button>
        <button class="btn-action" id="btn-kirim" style="display:none; background:#007bff; color:white;" onclick="kirimKeDrive()">GUNAKAN FOTO</button>
        <button class="btn-action" id="btn-ulang" style="display:none; background:#f0f0f0; color:#333; margin-top:5px;" onclick="bukaKamera()">AMBIL ULANG</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec";
    let daftarToko = [], streamAktif = null, koleksiFoto = [null, null, null, null], logWaktu = [null, null, null, null];
    let slotDipilih = null, namaTahapDipilih = "", isTokoValid = false;

    window.onload = () => { muatDaftarToko(); };

    async function muatDaftarToko() {
        try {
            const r = await fetch(GAS_URL);
            daftarToko = await r.json();
            const l = document.getElementById('listToko');
            daftarToko.forEach(t => { let o = document.createElement('option'); o.value = t.kode; l.appendChild(o); });
            document.getElementById('kodeToko').disabled = false;
            document.getElementById('displayNama').innerText = "Database Siap";
        } catch (e) { document.getElementById('displayNama').innerText = "Gagal Sinkron Database!"; }
    }

    function updateNamaToko() {
        const kode = document.getElementById('kodeToko').value.trim().toUpperCase();
        const t = daftarToko.find(x => x.kode.toUpperCase() === kode);
        const d = document.getElementById('displayNama');
        if(t) { d.innerText = "Toko: " + t.nama; d.style.color = "#28a745"; isTokoValid = true; }
        else { d.innerText = "Cari Kode Toko..."; d.style.color = "#888"; isTokoValid = false; }
    }

    function pilihTahap(idx, nama) {
        if(!isTokoValid) return alert("Pilih Kode Toko dulu!");
        slotDipilih = idx; namaTahapDipilih = nama;
        document.getElementById('camContainer').style.display = "flex";
        document.getElementById('labelCam').innerText = nama;
        bukaKamera();
    }

    async function bukaKamera() {
        document.getElementById('preview').style.display = "none";
        document.getElementById('video').style.display = "block";
        document.getElementById('btn-snap').style.display = "block";
        document.getElementById('btn-kirim').style.display = "none";
        document.getElementById('btn-ulang').style.display = "none";
        if (!streamAktif) {
            streamAktif = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} } });
            document.getElementById('video').srcObject = streamAktif;
        }
    }

    function tutupKamera() {
        if (streamAktif) { streamAktif.getTracks().forEach(t => t.stop()); streamAktif = null; }
        document.getElementById('camContainer').style.display = "none";
    }

    function tangkapFoto() {
        const v = document.getElementById('video'), c = document.getElementById('canvas'), ctx = c.getContext('2d');
        let w = v.videoWidth, h = v.videoHeight;
        c.width = w; c.height = h;
        ctx.drawImage(v, 0, 0);

        const skrg = new Date();
        const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        const tglStr = `${skrg.getDate()} ${bulan[skrg.getMonth()]} ${skrg.getFullYear()} ${skrg.getHours().toString().padStart(2,'0')}:${skrg.getMinutes().toString().padStart(2,'0')}:${skrg.getSeconds().toString().padStart(2,'0')}`;
        logWaktu[slotDipilih] = tglStr;

        // TIMESTAMP (Sesuai permintaan: Kecil, Putih, Stroke Hitam)
        ctx.font = "bold 22px monospace";
        ctx.lineWidth = 4; ctx.strokeStyle = "black";
        ctx.strokeText(tglStr + " WIB", 20, h - 25);
        ctx.fillStyle = "white"; ctx.fillText(tglStr + " WIB", 20, h - 25);

        // AUTO ROTASI LANDSCAPE KE PORTRAIT (Anti-Gepeng)
        let finalImage;
        if (w > h) {
            const rCvs = document.createElement('canvas');
            const rCtx = rCvs.getContext('2d');
            rCvs.width = h; rCvs.height = w;
            rCtx.translate(h, 0); rCtx.rotate(90 * Math.PI / 180);
            rCtx.drawImage(c, 0, 0);
            finalImage = rCvs.toDataURL('image/jpeg', 0.8);
        } else {
            finalImage = c.toDataURL('image/jpeg', 0.8);
        }

        document.getElementById('preview').src = finalImage;
        document.getElementById('preview').style.display = "block";
        v.style.display = "none";
        document.getElementById('btn-snap').style.display = "none";
        document.getElementById('btn-kirim').style.display = "block";
        document.getElementById('btn-ulang').style.display = "block";
    }

    function kirimKeDrive() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        loader.style.display = "flex";
        fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ tahap: namaTahapDipilih, kodeToko: kode, foto: document.getElementById('preview').src, waktu: logWaktu[slotDipilih] }) })
        .then(() => {
            isiSlotVisual(document.getElementById('preview').src, slotDipilih);
            loader.style.display = "none"; tutupKamera();
        });
    }

    function isiSlotVisual(data, idx) {
        koleksiFoto[idx] = data;
        const s = document.getElementById('slot-'+idx);
        s.src = data; s.style.display = "block";
        const grid = document.querySelectorAll('.slot-grid')[idx];
        grid.style.border = "2px solid #28a745";
        grid.style.background = "#fff";
        document.querySelectorAll('.slot-label')[idx].style.display = "none";
        document.getElementById('btn-save-all').style.display = "block";
    }

    function buatKolase() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        loader.style.display = "flex";
        
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        c.width = 1600; c.height = 2200; // Layout Kolase 2x2
        ctx.fillStyle = "white"; ctx.fillRect(0,0,c.width,c.height);
        
        const loads = koleksiFoto.map((s, i) => new Promise(res => {
            if(s) { const img = new Image(); img.onload = () => res({img, i}); img.src = s; } else res({img:null, i});
        }));

        Promise.all(loads).then(res => {
            res.forEach(item => {
                const col = item.i % 2;
                const row = Math.floor(item.i / 2);
                const x = col * 800 + 10;
                const y = row * 1050 + 100;
                
                if(item.img) {
                    let iw = item.img.width, ih = item.img.height;
                    let r = Math.min(780 / iw, 1000 / ih);
                    let nw = iw * r, nh = ih * r;
                    let cx = x + (780 - nw) / 2;
                    let cy = y + (1000 - nh) / 2;
                    ctx.fillStyle = "#f9f9f9";
                    ctx.fillRect(x, y, 780, 1000);
                    ctx.drawImage(item.img, 0, 0, iw, ih, cx, cy, nw, nh);
                }
            });
            
            ctx.fillStyle = "#007bff"; ctx.fillRect(0, 0, c.width, 80);
            ctx.fillStyle = "white"; ctx.font = "bold 30px Arial";
            ctx.fillText(`KOLASE LAPORAN: ${kode} - ${document.getElementById('displayNama').innerText}`, 20, 50);
            
            const l = document.createElement('a');
            l.href = c.toDataURL('image/jpeg', 0.9);
            l.download = `KOLASE_${kode}.jpg`;
            l.click();
            loader.style.display = "none";
        });
    }
</script>
</body>
</html>
