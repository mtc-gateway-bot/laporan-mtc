<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACL FOTO PEKERJAAN v1 (PORTRAIT MODE)</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; margin: 0; background: #fff; color: #000; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #007bff; padding: 15px; font-weight: bold; color: white; text-align: center; border-bottom: 3px solid #000; }
        .container { padding: 10px; flex: 1; max-width: 500px; margin: auto; width: 100%; box-sizing: border-box; }
        
        .form-group { width: 100%; margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #000; background: #fff; color: #000; box-sizing: border-box; font-size: 16px; font-family: 'Courier New', monospace; font-weight: bold; }
        #displayNama { margin-top: 5px; font-size: 13px; color: #007bff; font-weight: bold; background: #f0f0f0; padding: 8px; border: 1px solid #000; white-space: pre; }
        
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .slot-grid { aspect-ratio: 3/4; background: #fff; border: 2px solid #000; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .slot-grid img { width: 100%; height: 100%; object-fit: contain; background: #eee; }
        .slot-label { font-size: 11px; font-weight: bold; position: absolute; top: 0; left: 0; background: #000; color: #fff; padding: 2px 6px; z-index: 10; }

        #camContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .cam-view { flex: 1; position: relative; overflow: hidden; }
        video, #preview { width: 100%; height: 100%; object-fit: contain; }
        #ghost { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.35; display: none; pointer-events: none; }
        
        .cam-bottom-panel { height: 160px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-top: 3px solid #000; }
        .btn-capture { background: #fff; border-radius: 50%; width: 75px; height: 75px; border: 6px solid #007bff; cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .btn-action { padding: 15px; width: 85%; border-radius: 0; font-weight: bold; border: 3px solid #000; cursor: pointer; font-family: 'Courier New', monospace; font-size: 14px; }
        .btn-close { position: absolute; top: 15px; right: 15px; background: #ff0000; color: white; border: 2px solid #000; padding: 8px 15px; z-index: 10005; font-weight: bold; cursor: pointer; }

        #loaderOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10010; font-weight: bold; border: 5px solid #007bff; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="loaderOverlay">MENGIRIM FOTO...<br>HARAP TUNGGU</div>

<div class="header">ACL FOTO PEKERJAAN v1 (REVISED)</div>

<div class="container">
    <div class="form-group">
        <label>KODE TOKO:</label>
        <input list="listToko" id="kodeToko" placeholder="INPUT KODE..." oninput="updateNamaToko()" disabled>
        <datalist id="listToko"></datalist>
        <div id="displayNama">MENUNGGU DATA...</div>
    </div>

    <div class="photo-grid">
        <div class="slot-grid" onclick="pilihTahap(0, 'FOTO SEBELUM')"><img id="slot-0" style="display:none;"><span class="slot-label">SEBELUM</span></div>
        <div class="slot-grid" onclick="pilihTahap(1, 'FOTO PROSES 1')"><img id="slot-1" style="display:none;"><span class="slot-label">PROSES 1</span></div>
        <div class="slot-grid" onclick="pilihTahap(2, 'FOTO PROSES 2')"><img id="slot-2" style="display:none;"><span class="slot-label">PROSES 2</span></div>
        <div class="slot-grid" onclick="pilihTahap(3, 'FOTO SESUDAH')"><img id="slot-3" style="display:none;"><span class="slot-label">SESUDAH</span></div>
    </div>
    
    <button id="btn-save-all" onclick="buatKolase()" style="margin-top:20px; width:100%; padding:18px; background:#28a745; color:white; border:3px solid #000; font-weight:bold; display:none; cursor:pointer; font-family: 'Courier New', monospace;">DOWNLOAD KOLASE (PORTRAIT)</button>
</div>

<div id="camContainer">
    <button class="btn-close" onclick="tutupKamera()">BATAL</button>
    <div class="cam-view">
        <video id="video" autoplay playsinline></video>
        <img id="preview">
        <img id="ghost">
    </div>
    <div class="cam-bottom-panel">
        <div id="labelCam" style="font-weight:bold; color:#007bff; font-size:14px;"></div>
        <button class="btn-capture" id="btn-snap" onclick="tangkapFoto()"></button>
        <button class="btn-action" id="btn-kirim" style="display:none; background:#007bff; color:white;" onclick="kirimKeDrive()">SIMPAN FOTO KE DRIVE</button>
        <button class="btn-action" id="btn-ulang" style="display:none; background:#eee; margin-top:5px;" onclick="bukaKamera()">AMBIL ULANG</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec";
    let daftarToko = [], streamAktif = null, koleksiFoto = [null, null, null, null], logWaktu = [null, null, null, null];
    let slotDipilih = null, namaTahapDipilih = "", isTokoValid = false;

    window.onload = () => { muatDaftarToko(); };

    async function muatDaftarToko() {
        try {
            const r = await fetch(GAS_URL);
            daftarToko = await r.json();
            const l = document.getElementById('listToko');
            daftarToko.forEach(t => { let o = document.createElement('option'); o.value = t.kode; l.appendChild(o); });
            document.getElementById('kodeToko').disabled = false;
            document.getElementById('displayNama').innerText = "DATABASE: READY";
        } catch (e) { document.getElementById('displayNama').innerText = "DATABASE: ERROR"; }
    }

    function padText(text, length) {
        text = text.toString();
        return text.length >= length ? text : text + " ".repeat(length - text.length);
    }

    function updateNamaToko() {
        const kode = document.getElementById('kodeToko').value.trim().toUpperCase();
        const t = daftarToko.find(x => x.kode.toUpperCase() === kode);
        const d = document.getElementById('displayNama');
        if(t) { 
            d.innerText = "TOKO : " + t.nama + "\nKORWIL: " + (t.korwil || "-"); 
            d.style.color = "#28a745"; 
            isTokoValid = true;
            const ghostData = localStorage.getItem("ghost_" + kode);
            if(ghostData) { koleksiFoto[0] = ghostData; isiSlotVisual(ghostData, 0); }
        }
        else { d.innerText = "STATUS: KODE TIDAK VALID"; d.style.color = "#ff0000"; isTokoValid = false; }
    }

    function pilihTahap(idx, nama) {
        if(!isTokoValid) return alert("VALIDASI: Silahkan pilih Kode Toko!");
        slotDipilih = idx; namaTahapDipilih = nama;
        document.getElementById('camContainer').style.display = "flex";
        document.getElementById('labelCam').innerText = "MODE: " + nama;
        
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        const ghostData = localStorage.getItem("ghost_" + kode);
        if(nama === "FOTO SESUDAH" && ghostData) {
            document.getElementById('ghost').src = ghostData;
            document.getElementById('ghost').style.display = "block";
        } else { document.getElementById('ghost').style.display = "none"; }
        
        bukaKamera();
    }

    async function bukaKamera() {
        document.getElementById('preview').style.display = "none";
        document.getElementById('video').style.display = "block";
        document.getElementById('btn-snap').style.display = "block";
        document.getElementById('btn-kirim').style.display = "none";
        document.getElementById('btn-ulang').style.display = "none";
        if (!streamAktif) {
            streamAktif = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280, height: 720 } });
            document.getElementById('video').srcObject = streamAktif;
        }
    }

    function tutupKamera() {
        if (streamAktif) { streamAktif.getTracks().forEach(t => t.stop()); streamAktif = null; }
        document.getElementById('camContainer').style.display = "none";
    }

    function tangkapFoto() {
        const v = document.getElementById('video'), c = document.getElementById('canvas'), ctx = c.getContext('2d');
        let w = v.videoWidth, h = v.videoHeight;
        c.width = w; c.height = h;
        ctx.drawImage(v, 0, 0);

        const skrg = new Date();
        const tglStr = `${skrg.getDate()}/${skrg.getMonth()+1}/${skrg.getFullYear()} ${skrg.getHours().toString().padStart(2,'0')}:${skrg.getMinutes().toString().padStart(2,'0')}:${skrg.getSeconds().toString().padStart(2,'0')}`;
        logWaktu[slotDipilih] = tglStr;

        // TIMESTAMP (SESUAI REQUEST: PUTIH, STROKE HITAM, TIDAK KEPOTONG)
        ctx.font = "bold 24px monospace";
        ctx.lineWidth = 4; ctx.strokeStyle = "black";
        ctx.strokeText(tglStr + " WIB", 25, h - 30);
        ctx.fillStyle = "white"; ctx.fillText(tglStr + " WIB", 25, h - 30);

        let finalImg = c.toDataURL('image/jpeg', 0.8);
        document.getElementById('preview').src = finalImg;
        document.getElementById('preview').style.display = "block";
        v.style.display = "none";
        document.getElementById('btn-snap').style.display = "none";
        document.getElementById('btn-kirim').style.display = "block";
        document.getElementById('btn-ulang').style.display = "block";
    }

    function kirimKeDrive() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        loader.style.display = "flex";
        const imgBase64 = document.getElementById('preview').src;

        fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ tahap: namaTahapDipilih, kodeToko: kode, foto: imgBase64, waktu: logWaktu[slotDipilih] }) })
        .then(() => {
            if(namaTahapDipilih === "FOTO SEBELUM") localStorage.setItem("ghost_" + kode, imgBase64);
            isiSlotVisual(imgBase64, slotDipilih);
            loader.style.display = "none"; tutupKamera();
        });
    }

    function isiSlotVisual(data, idx) {
        koleksiFoto[idx] = data;
        const s = document.getElementById('slot-'+idx);
        s.src = data; s.style.display = "block";
        document.querySelectorAll('.slot-grid')[idx].style.borderColor = "#28a745";
        document.getElementById('btn-save-all').style.display = "block";
    }

    function buatKolase() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        loader.style.display = "flex";
        
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        
        // CANVAS PORTRAIT: Lebar 1200, Tinggi 2400 (4 Foto vertikal)
        c.width = 1200; 
        c.height = 2400; 
        ctx.fillStyle = "white"; ctx.fillRect(0,0,c.width,c.height);
        
        const loads = koleksiFoto.map((s, i) => new Promise(res => {
            if(s) { const img = new Image(); img.onload = () => res({img, i}); img.src = s; } else res({img:null, i});
        }));

        Promise.all(loads).then(res => {
            res.forEach(item => {
                const yPos = (item.i * 580) + 80; // Susun menurun ke bawah
                if(item.img) {
                    let iw = item.img.width, ih = item.img.height;
                    let r = Math.min(1160 / iw, 560 / ih);
                    let nw = iw * r, nh = ih * r;
                    let cx = 20 + (1160 - nw) / 2;
                    let cy = yPos + (560 - nh) / 2;
                    ctx.fillStyle = "#000";
                    ctx.fillRect(20, yPos, 1160, 560);
                    ctx.drawImage(item.img, 0, 0, iw, ih, cx, cy, nw, nh);
                }
            });
            
            // Header Kolase Tetap Monospace
            ctx.fillStyle = "#007bff"; ctx.fillRect(0, 0, c.width, 70);
            ctx.fillStyle = "white"; ctx.font = "bold 30px Courier New";
            ctx.fillText("KOLASE PEKERJAAN: " + kode, 30, 45);
            
            const l = document.createElement('a');
            l.href = c.toDataURL('image/jpeg', 0.9);
            l.download = `KOLASE_PORTRAIT_${kode}.jpg`;
            l.click();
            loader.style.display = "none";
        });
    }
</script>
</body>
</html>
