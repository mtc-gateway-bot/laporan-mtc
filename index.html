<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACL FOTO PEKERJAAN v1.6 (Portrait Layout)</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; margin: 0; background: #ffffff; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: #007bff; padding: 15px; font-weight: bold; color: white; text-align: center; }
        .container { padding: 15px; flex: 1; max-width: 500px; margin: auto; width: 100%; box-sizing: border-box; }
        
        .form-group { width: 100%; margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 14px; border-radius: 5px; border: 2px solid #333; background: #fff; color: #333; box-sizing: border-box; font-size: 16px; font-weight: bold; }
        #displayNama { margin-top: 8px; font-size: 14px; color: #007bff; font-weight: bold; border: 1px dashed #007bff; padding: 10px; background: #f0f7ff; }
        
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .slot-grid { aspect-ratio: 3/4; background: #eee; border: 2px solid #333; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .slot-grid img { width: 100%; height: 100%; object-fit: contain; }
        .slot-label { font-size: 10px; font-weight: bold; position: absolute; background: #333; color: #fff; padding: 2px 5px; top: 0; left: 0; }

        #camContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .cam-view { flex: 1; position: relative; overflow: hidden; }
        video, #preview { width: 100%; height: 100%; object-fit: contain; }
        #ghost { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.3; display: none; pointer-events: none; }
        
        .cam-bottom-panel { height: 150px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .btn-capture { background: #fff; border-radius: 50%; width: 70px; height: 70px; border: 5px solid #007bff; cursor: pointer; }
        .btn-action { padding: 15px; width: 80%; border-radius: 5px; font-weight: bold; border: 2px solid #333; cursor: pointer; }
        .btn-close { position: absolute; top: 20px; right: 20px; background: #ff4d4d; color: white; border: 2px solid #333; padding: 10px; z-index: 10005; font-weight: bold; }

        #loaderOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10010; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="loaderOverlay"><b style="color:#007bff">MENGIRIM DATA...</b></div>

<div class="header">ACL FOTO PEKERJAAN v1.6</div>

<div class="container">
    <div class="form-group">
        <input list="listToko" id="kodeToko" placeholder="KETIK KODE TOKO..." oninput="updateNamaToko()" disabled>
        <datalist id="listToko"></datalist>
        <div id="displayNama">LOADING DATABASE...</div>
    </div>

    <div class="photo-grid">
        <div class="slot-grid" onclick="pilihTahap(0, 'FOTO SEBELUM')"><img id="slot-0" style="display:none;"><span class="slot-label">SEBELUM</span></div>
        <div class="slot-grid" onclick="pilihTahap(1, 'FOTO PROSES 1')"><img id="slot-1" style="display:none;"><span class="slot-label">PROSES 1</span></div>
        <div class="slot-grid" onclick="pilihTahap(2, 'FOTO PROSES 2')"><img id="slot-2" style="display:none;"><span class="slot-label">PROSES 2</span></div>
        <div class="slot-grid" onclick="pilihTahap(3, 'FOTO SESUDAH')"><img id="slot-3" style="display:none;"><span class="slot-label">SESUDAH</span></div>
    </div>
    
    <button id="btn-save-all" onclick="buatKolase()" style="margin-top:20px; width:100%; padding:15px; background:#28a745; color:white; border:2px solid #333; font-weight:bold; display:none; cursor:pointer;">DOWNLOAD KOLASE PORTRAIT</button>
</div>

<div id="camContainer">
    <button class="btn-close" onclick="tutupKamera()">BATAL</button>
    <div class="cam-view">
        <video id="video" autoplay playsinline></video>
        <img id="preview">
        <img id="ghost">
    </div>
    <div class="cam-bottom-panel">
        <div id="labelCam" style="font-weight:bold; color:#007bff"></div>
        <button class="btn-capture" id="btn-snap" onclick="tangkapFoto()"></button>
        <button class="btn-action" id="btn-kirim" style="display:none; background:#007bff; color:white;" onclick="kirimKeDrive()">SIMPAN FOTO</button>
        <button class="btn-action" id="btn-ulang" style="display:none; background:#eee;" onclick="bukaKamera()">AMBIL ULANG</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec";
    let daftarToko = [], streamAktif = null, koleksiFoto = [null, null, null, null], logWaktu = [null, null, null, null];
    let slotDipilih = null, namaTahapDipilih = "", isTokoValid = false;

    window.onload = () => { muatDaftarToko(); };

    async function muatDaftarToko() {
        try {
            const r = await fetch(GAS_URL);
            daftarToko = await r.json();
            const l = document.getElementById('listToko');
            daftarToko.forEach(t => { let o = document.createElement('option'); o.value = t.kode; l.appendChild(o); });
            document.getElementById('kodeToko').disabled = false;
            document.getElementById('displayNama').innerText = "DATABASE SIAP";
        } catch (e) { document.getElementById('displayNama').innerText = "ERROR DATABASE!"; }
    }

    function updateNamaToko() {
        const kode = document.getElementById('kodeToko').value.trim().toUpperCase();
        const t = daftarToko.find(x => x.kode.toUpperCase() === kode);
        const d = document.getElementById('displayNama');
        if(t) { 
            d.innerText = "TOKO: " + t.nama; d.style.color = "#28a745"; isTokoValid = true;
            // Muat bayangan foto sebelum jika ada
            const sblm = localStorage.getItem("ghost_" + kode);
            if(sblm) { koleksiFoto[0] = sblm; isiSlotVisual(sblm, 0); }
        }
        else { d.innerText = "KODE TIDAK DIKENAL"; d.style.color = "#ff4d4d"; isTokoValid = false; }
    }

    function pilihTahap(idx, nama) {
        if(!isTokoValid) return alert("Pilih Kode Toko dulu!");
        slotDipilih = idx; namaTahapDipilih = nama;
        document.getElementById('camContainer').style.display = "flex";
        document.getElementById('labelCam').innerText = nama;
        
        // Fitur Ghosting untuk Foto Sesudah
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        const sblm = localStorage.getItem("ghost_" + kode);
        if(nama === "FOTO SESUDAH" && sblm) {
            document.getElementById('ghost').src = sblm;
            document.getElementById('ghost').style.display = "block";
        } else {
            document.getElementById('ghost').style.display = "none";
        }
        
        bukaKamera();
    }

    async function bukaKamera() {
        document.getElementById('preview').style.display = "none";
        document.getElementById('video').style.display = "block";
        document.getElementById('btn-snap').style.display = "block";
        document.getElementById('btn-kirim').style.display = "none";
        document.getElementById('btn-ulang').style.display = "none";
        if (!streamAktif) {
            streamAktif = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280, height: 720 } });
            document.getElementById('video').srcObject = streamAktif;
        }
    }

    function tutupKamera() {
        if (streamAktif) { streamAktif.getTracks().forEach(t => t.stop()); streamAktif = null; }
        document.getElementById('camContainer').style.display = "none";
    }

    function tangkapFoto() {
        const v = document.getElementById('video'), c = document.getElementById('canvas'), ctx = c.getContext('2d');
        let w = v.videoWidth, h = v.videoHeight;
        c.width = w; c.height = h;
        ctx.drawImage(v, 0, 0);

        // Timestamp Sesuai Permintaan
        const skrg = new Date();
        const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
        const tglStr = `${skrg.getDate()} ${bulan[skrg.getMonth()]} ${skrg.getFullYear()} ${skrg.getHours().toString().padStart(2,'0')}:${skrg.getMinutes().toString().padStart(2,'0')}:${skrg.getSeconds().toString().padStart(2,'0')}`;
        logWaktu[slotDipilih] = tglStr;

        ctx.font = "bold 22px monospace";
        ctx.lineWidth = 4; ctx.strokeStyle = "black";
        ctx.strokeText(tglStr + " WIB", 20, h - 25);
        ctx.fillStyle = "white"; ctx.fillText(tglStr + " WIB", 20, h - 25);

        let finalImg = c.toDataURL('image/jpeg', 0.8);
        document.getElementById('preview').src = finalImg;
        document.getElementById('preview').style.display = "block";
        v.style.display = "none";
        document.getElementById('btn-snap').style.display = "none";
        document.getElementById('btn-kirim').style.display = "block";
        document.getElementById('btn-ulang').style.display = "block";
    }

    function kirimKeDrive() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        loader.style.display = "flex";
        const dataFoto = document.getElementById('preview').src;

        fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ tahap: namaTahapDipilih, kodeToko: kode, foto: dataFoto, waktu: logWaktu[slotDipilih] }) })
        .then(() => {
            if(namaTahapDipilih === "FOTO SEBELUM") localStorage.setItem("ghost_" + kode, dataFoto);
            isiSlotVisual(dataFoto, slotDipilih);
            loader.style.display = "none"; tutupKamera();
        });
    }

    function isiSlotVisual(data, idx) {
        koleksiFoto[idx] = data;
        const s = document.getElementById('slot-'+idx);
        s.src = data; s.style.display = "block";
        document.querySelectorAll('.slot-grid')[idx].style.borderColor = "#28a745";
        document.getElementById('btn-save-all').style.display = "block";
    }

    function buatKolase() {
        const loader = document.getElementById('loaderOverlay');
        const kode = document.getElementById('kodeToko').value.toUpperCase();
        const namaToko = document.getElementById('displayNama').innerText;
        loader.style.display = "flex";
        
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        
        // SET CANVAS KE PORTRAIT (1200 x 1800)
        c.width = 1200; 
        c.height = 1800; 
        ctx.fillStyle = "white"; ctx.fillRect(0,0,c.width,c.height);
        
        const loads = koleksiFoto.map((s, i) => new Promise(res => {
            if(s) { const img = new Image(); img.onload = () => res({img, i}); img.src = s; } else res({img:null, i});
        }));

        Promise.all(loads).then(res => {
            res.forEach(item => {
                // Layout 2 kolom x 2 baris tetap, tapi dalam canvas portrait
                const col = item.i % 2;
                const row = Math.floor(item.i / 2);
                const x = col * 600;
                const y = row * 800 + 150; // Jarak untuk header
                
                if(item.img) {
                    let iw = item.img.width, ih = item.img.height;
                    let r = Math.min(580 / iw, 780 / ih);
                    let nw = iw * r, nh = ih * r;
                    let cx = x + (600 - nw) / 2;
                    let cy = y + (800 - nh) / 2;
                    ctx.drawImage(item.img, 0, 0, iw, ih, cx, cy, nw, nh);
                }
            });
            
            // Header Kolase
            ctx.fillStyle = "#007bff"; ctx.fillRect(0, 0, c.width, 120);
            ctx.fillStyle = "white"; ctx.font = "bold 30px Courier New";
            ctx.fillText("ACL FOTO PEKERJAAN", 40, 50);
            ctx.font = "bold 25px Courier New";
            ctx.fillText(kode + " - " + namaToko, 40, 90);
            
            const l = document.createElement('a');
            l.href = c.toDataURL('image/jpeg', 0.9);
            l.download = `KOLASE_${kode}_PORTRAIT.jpg`;
            l.click();
            loader.style.display = "none";
        });
    }
</script>
</body>
</html>
