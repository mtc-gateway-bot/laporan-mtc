<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Presisi Lampung</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #1a1a1a; color: white; text-align: center; }
        .header { background: #007bff; padding: 15px; font-weight: bold; font-size: 1.2em; }
        .container { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .form-group { width: 100%; max-width: 350px; margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; color: #aaa; margin-bottom: 5px; display: block; }
        select, input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; 
            background: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px;
        }

        .camera-box { 
            position: relative; width: 100%; max-width: 350px; height: 380px; 
            background: #000; border: 2px solid #333; border-radius: 12px; overflow: hidden;
        }
        video, #preview { width: 100%; height: 100%; object-fit: cover; }
        #preview { display: none; }
        #ghost { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0.4; display: none; pointer-events: none; 
        }

        .btn-group { margin-top: 15px; width: 100%; max-width: 350px; }
        button { 
            width: 100%; padding: 15px; font-size: 16px; font-weight: bold; 
            border: none; border-radius: 8px; margin-bottom: 10px; cursor: pointer;
        }
        #btn-main { background: #ffc107; color: black; }
        #btn-send { background: #28a745; color: white; display: none; }
        #btn-retry { background: #6c757d; color: white; display: none; }
        
        #status { font-size: 12px; color: #888; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="header">FOTO LAPORAN PEKERJAAN</div>

<div class="container">
    <div class="form-group">
        <label>Tahap Pekerjaan:</label>
        <select id="tahap" onchange="toggleGhost()">
            <option value="SEBELUM">FOTO SEBELUM</option>
            <option value="PROSES">FOTO PROSES PEKERJAAN</option>
            <option value="SESUDAH">FOTO SESUDAH</option>
        </select>
    </div>

    <div class="form-group">
        <label>Kode Toko (Cari/Ketik):</label>
        <input list="listToko" id="kodeToko" placeholder="Contoh: T001..." onfocus="muatDaftarToko()">
        <datalist id="listToko"></datalist>
    </div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <img id="preview" />
        <img id="ghost" src="" />
    </div>

    <div class="btn-group">
        <button id="btn-main" onclick="handleKamera()">AKTIFKAN KAMERA</button>
        <button id="btn-send" onclick="kirimKeDrive()">KIRIM LAPORAN</button>
        <button id="btn-retry" onclick="resetKamera()">AMBIL ULANG</button>
        <p id="status">Status: Menunggu Izin</p>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const ghost = document.getElementById('ghost');
    const btnMain = document.getElementById('btn-main');
    const btnSend = document.getElementById('btn-send');
    const btnRetry = document.getElementById('btn-retry');
    const statusTxt = document.getElementById('status');
    const canvas = document.getElementById('canvas');

    // GANTI INI DENGAN URL /exec ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyj3n-GH4pnX1CiPptqqHlU50N0MuaUaqTYBEe_pDr3n_aW1b15QokVlUlEXeijD09I/exec";

    let streamAktif = null;
    let fotoSebelumnya = null;

    async function muatDaftarToko() {
        const list = document.getElementById('listToko');
        if (list.options.length > 0) return;
        statusTxt.innerText = "Memuat daftar toko...";
        try {
            const res = await fetch(GAS_URL + "?action=getStoreList");
            const data = await res.json();
            data.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.kode;
                opt.text = t.nama;
                list.appendChild(opt);
            });
            statusTxt.innerText = "Daftar toko dimuat.";
        } catch (e) { statusTxt.innerText = "Gagal muat daftar."; }
    }

    async function handleKamera() {
        if (!streamAktif) {
            try {
                streamAktif = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = streamAktif;
                btnMain.innerText = "AMBIL FOTO";
                statusTxt.innerText = "Kamera Aktif.";
                toggleGhost();
            } catch (e) { alert("Izin kamera ditolak!"); }
        } else {
            tangkapFoto();
        }
    }

    function toggleGhost() {
        const tahap = document.getElementById('tahap').value;
        if (tahap === "SESUDAH" && fotoSebelumnya) {
            ghost.src = fotoSebelumnya;
            ghost.style.display = "block";
            statusTxt.innerText = "Ghost Mode Aktif (40%)";
        } else {
            ghost.style.display = "none";
        }
    }

    function tangkapFoto() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg', 0.8);
        
        preview.src = data;
        video.style.display = "none";
        preview.style.display = "block";
        ghost.style.display = "none";
        btnMain.style.display = "none";
        btnSend.style.display = "block";
        btnRetry.style.display = "block";
    }

    function resetKamera() {
        video.style.display = "block";
        preview.style.display = "none";
        btnMain.style.display = "block";
        btnSend.style.display = "none";
        btnRetry.style.display = "none";
        toggleGhost();
    }

    function kirimKeDrive() {
        const kode = document.getElementById('kodeToko').value;
        const tahap = document.getElementById('tahap').value;
        if(!kode) return alert("Pilih Kode Toko!");

        statusTxt.innerText = "Sedang mengirim ke Drive...";
        btnSend.disabled = true;

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                tahap: tahap,
                kodeToko: kode,
                foto: preview.src
            })
        }).then(() => {
            alert("Berhasil! Foto tersimpan di folder toko.");
            if (tahap === "SEBELUM") fotoSebelumnya = preview.src;
            location.reload();
        }).catch(e => {
            alert("Gagal kirim.");
            btnSend.disabled = false;
        });
    }
</script>
</body>
</html>
